<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Rafiq — employee journey companion prototype (synthetic data).">
<title>Rafiq — Employee Journey Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><b>Rafiq</b><span data-i18n="tagline">Employee journey companion</span></div>
  <nav class="roles hidden" id="nav" aria-label="Sections"></nav>
  <div class="spacer"></div>
  <div class="who hidden" id="who"></div>
  <button class="lang" id="langBtn" aria-label="Switch language">العربية</button>
  <button class="lang hidden" id="logoutBtn">Sign out</button>
</header>
<div class="banner" id="banner"></div>
<main id="view" tabindex="-1"><p class="empty">Loading Rafiq… (the first visit after a quiet period can take up to a minute)</p></main>

<dialog id="dlg"><div id="dlgInner"></div></dialog>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
