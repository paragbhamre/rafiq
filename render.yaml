# Render Blueprint — Rafiq prototype (synthetic data only)
# Database: Render Postgres "rafiq-db" (Frankfurt, private network only) is created in the dashboard,
# and its Internal Database URL is set on the web service as DATABASE_URL (never committed).

services:
  - type: web
    name: rafiq-journey-companion
    runtime: docker
    plan: free            # switch to "starter" during judging so the app never sleeps
    region: frankfurt     # closest Render region to the UAE
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Rafiq runs on today's date (Dubai time). Pack dates are moved forward from this reference date,
      # so every seeded journey looks the same on any day. Do not set RAFIQ_FREEZE_DATE here.
      - key: RAFIQ_PACK_REFERENCE_DATE
        value: "2026-10-14"
      - key: RAFIQ_TZ
        value: Asia/Dubai
      - key: LLM_PROVIDER
        value: anthropic  # AI writer on; falls back to offline automatically if the key is missing or the API fails
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_API_KEY
        sync: false       # entered by you in the Render dashboard, never committed
      - key: RAFIQ_MIN_GROUP_SIZE
        value: "10"
      # Sign-in: one account per person. Passwords are set in the Render dashboard, never committed.
      - key: RAFIQ_PASSWORD_MODE
        value: shared      # "per_user" gives every account its own password (admin downloads the sheet)
      - key: RAFIQ_DEMO_PASSWORD
        sync: false
      - key: RAFIQ_ADMIN_PASSWORD
        sync: false
      - key: RAFIQ_SESSION_SECRET
        generateValue: true
      # Runtime state (requests, cases, consent, audit, conversations) in Postgres over the private network
      - key: DATABASE_URL
        sync: false       # Internal Database URL of rafiq-db, set in the Render dashboard
